# The metamodel plug-in: the Ecore model, the code generated from it (src-gen) and the
# hand-written derived features and constraints (src).

bin.includes = .,\
               model/,\
               META-INF/,\
               plugin.xml,\
               plugin.properties
jars.compile.order = .
source.. = src-gen/,\
           src/
output.. = bin/

name: Build

on:
  push:
  pull_request:

jobs:
  # Builds the plug-ins and runs the tests, then generates each example edition into the game and builds
  # the game, so the generated Java code of every edition is compiled. On Windows, it runs the Quick start
  # of the README in the Command Prompt.
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        edition: [classic, arcade, hardcore]
        include:
          - os: windows-latest
            edition: arcade
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test the DSL, generate the ${{ matrix.edition }} edition and build the game
        # The runner has an Android SDK. Unset it so the game leaves out its Android module.
        if: runner.os != 'Windows'
        run: |
          unset ANDROID_HOME ANDROID_SDK_ROOT
          ./mvnw -B verify -Pgame -Dedition=${{ matrix.edition }}
      - name: Build and test the DSL, generate the ${{ matrix.edition }} edition and build the game
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set ANDROID_HOME=
          set ANDROID_SDK_ROOT=
          .\mvnw -B verify -Pgame "-Dedition=${{ matrix.edition }}"
